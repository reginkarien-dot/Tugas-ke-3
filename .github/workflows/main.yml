
name: Build EXE

on:
  push:
    branches: [utama]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Compile C++ ke EXE
        shell: msys2 {0}
        run: g++ kasir.cpp -o mini_kasir.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: mini-kasir
          path: mini_kasir.exe
          
